<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Dashboard | Kobotec Construction Ltd</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet"><style>body{font-family:'Montserrat',sans-serif;}.bg-kobotec-blue{background-color:#0A1D37;}.text-kobotec-blue{color:#0A1D37;}.bg-kobotec-orange{background-color:#F58634;}.text-kobotec-orange{color:#F58634;}.border-kobotec-orange{border-color:#F58634;}.sidebar-item:hover{background-color:rgba(245,134,52,0.1);}</style></head><body class="bg-slate-50 flex min-h-screen"><div id="login" class="fixed inset-0 z-[100] bg-kobotec-blue flex items-center justify-center p-4"><form id="lf" class="bg-white rounded-2xl p-8 w-full max-w-sm space-y-4"><h2 class="text-2xl font-bold text-kobotec-blue">Admin Login</h2><input id="l-email" type="email" required placeholder="Email" class="w-full p-3 border rounded-lg"><input id="l-pass" type="password" required placeholder="Password" class="w-full p-3 border rounded-lg"><p id="l-err" class="text-sm text-red-600"></p><button class="w-full bg-kobotec-orange text-white py-3 rounded-lg font-bold">Sign In</button><button type="button" id="l-reset" class="w-full text-sm text-slate-500">Forgot password?</button></form></div><div id="pm" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4"><form id="pf" class="bg-white rounded-2xl p-6 w-full max-w-md space-y-3"><h3 id="pm-title" class="text-xl font-bold text-kobotec-blue">Project</h3><input id="p-title" required placeholder="Project title" class="w-full p-3 border rounded-lg"><textarea id="p-desc" rows="3" placeholder="Description" class="w-full p-3 border rounded-lg"></textarea><select id="p-status" class="w-full p-3 border rounded-lg"><option>Ongoing</option><option>Completed</option></select><input id="p-url" placeholder="Image URL (https://...)" class="w-full p-3 border rounded-lg"><input id="p-file" type="file" accept="image/*" class="w-full text-sm"><p id="p-err" class="text-sm text-red-600"></p><div class="flex gap-3"><button id="p-save" class="flex-1 bg-kobotec-orange text-white py-2 rounded-lg font-bold">Save</button><button type="button" id="p-cancel" class="flex-1 border py-2 rounded-lg">Cancel</button></div></form></div><aside class="w-64 bg-kobotec-blue text-white flex-shrink-0 flex flex-col hidden md:flex"><div class="p-6 border-b border-white/10"><img src="https://orchestratorbucket.nyc3.cdn.digitaloceanspaces.com/files/9846/715ffdc5-5c7c-4219-8090-20c30c7676e8_26192.jpg" alt="Logo" class="h-10 brightness-0 invert"></div><nav class="flex-grow p-4 space-y-2"><a href="#" class="flex items-center gap-3 p-3 rounded-lg bg-kobotec-orange"><img src="https://api.iconify.design/fa6-solid/chart-line.svg?color=white" class="w-5 h-5"> Dashboard</a><a href="#profile" class="flex items-center gap-3 p-3 rounded-lg sidebar-item transition"><img src="https://api.iconify.design/fa6-solid/building.svg?color=white" class="w-5 h-5"> Company Profile</a><a href="#projects" class="flex items-center gap-3 p-3 rounded-lg sidebar-item transition"><img src="https://api.iconify.design/fa6-solid/helmet-safety.svg?color=white" class="w-5 h-5"> Projects Gallery</a><a href="#inquiries" class="flex items-center gap-3 p-3 rounded-lg sidebar-item transition"><img src="https://api.iconify.design/fa6-solid/envelope.svg?color=white" class="w-5 h-5"> Site Inquiries</a></nav><div class="p-4 border-t border-white/10"><a href="#" id="logout" class="flex items-center gap-3 p-3 text-gray-400 hover:text-white transition"><img src="https://api.iconify.design/fa6-solid/right-from-bracket.svg?color=gray" class="w-5 h-5"> Logout</a></div></aside><main class="flex-grow flex flex-col"><header class="bg-white h-16 shadow-sm flex items-center justify-between px-8"><h1 class="text-xl font-bold text-kobotec-blue">Administrator Console</h1><div class="flex items-center gap-4"><div class="text-right"><p id="who" class="text-sm font-bold">Admin User</p><p class="text-xs text-slate-500">Abuja HQ Office</p></div><img src="https://picsum.photos/40/40" class="w-10 h-10 rounded-full border border-kobotec-orange"></div></header><div class="p-8 overflow-y-auto"><div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8"><div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-kobotec-orange"><p class="text-slate-500 text-sm uppercase font-semibold">Active Projects</p><h3 class="text-3xl font-bold text-kobotec-blue" id="s-active">–</h3></div><div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-kobotec-blue"><p class="text-slate-500 text-sm uppercase font-semibold">Site Inquiries</p><h3 class="text-3xl font-bold text-kobotec-blue" id="s-inq">–</h3></div><div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-green-500"><p class="text-slate-500 text-sm uppercase font-semibold">Completed Projects</p><h3 class="text-3xl font-bold text-green-500" id="s-done">–</h3></div><div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-yellow-500"><p class="text-slate-500 text-sm uppercase font-semibold">New Visit Requests</p><h3 class="text-3xl font-bold text-yellow-500" id="s-new">–</h3></div></div><section id="profile" class="mb-12"><div class="flex justify-between items-center mb-6"><h2 class="text-2xl font-bold text-kobotec-blue">Contact Information Management</h2><button id="save-company" class="bg-kobotec-blue text-white px-6 py-2 rounded-lg hover:bg-slate-800 transition">Save All Changes</button></div><div class="bg-white p-8 rounded-2xl shadow-sm space-y-6"><div class="grid grid-cols-1 md:grid-cols-3 gap-6"><div><label class="block text-sm font-semibold text-slate-600 mb-2">Primary Email</label><input type="email" id="f-email" value="Kobotec.trading.construction@gmail.com" class="w-full p-3 border rounded-lg focus:outline-none focus:border-kobotec-orange"></div><div><label class="block text-sm font-semibold text-slate-600 mb-2">Primary Phone</label><input type="text" id="f-phone" value="08168830451" class="w-full p-3 border rounded-lg focus:outline-none focus:border-kobotec-orange"></div><div><label class="block text-sm font-semibold text-slate-600 mb-2">Headquarters Location</label><input type="text" id="f-location" value="Abuja, Nigeria" class="w-full p-3 border rounded-lg focus:outline-none focus:border-kobotec-orange"></div></div><hr class="my-6"><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div><label class="block text-sm font-semibold text-slate-600 mb-2">Company Name</label><input type="text" id="f-name" value="Kobotec Construction Ltd" class="w-full p-3 border rounded-lg focus:outline-none focus:border-kobotec-orange"></div><div><label class="block text-sm font-semibold text-slate-600 mb-2">Tagline</label><input type="text" id="f-tagline" value="Where technology builds and dreams rise." class="w-full p-3 border rounded-lg focus:outline-none focus:border-kobotec-orange"></div></div><div><label class="block text-sm font-semibold text-slate-600 mb-2">About Description</label><textarea id="f-about" rows="4" class="w-full p-3 border rounded-lg focus:outline-none focus:border-kobotec-orange">Kobotec Construction Ltd is a leading Abuja-based company dedicated to providing top-quality construction services to clients across various sectors. With years of experience and a team of highly skilled professionals, we have established ourselves as a trusted name in the industry.</textarea></div></div></section><section id="projects" class="mb-12"><div class="flex justify-between items-center mb-6"><h2 class="text-2xl font-bold text-kobotec-blue">Projects Gallery</h2><button onclick="addProject()" class="bg-kobotec-orange text-white px-6 py-2 rounded-lg hover:bg-orange-600 transition flex items-center gap-2"><img src="https://api.iconify.design/fa6-solid/plus.svg?color=white" class="w-4 h-4"> Add New Project</button></div><div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div></section><section id="inquiries" class="mb-12"><h2 class="text-2xl font-bold text-kobotec-blue mb-6">Site Inquiries</h2><div id="inq-list" class="space-y-4"></div></section></div></main><script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAnalytics} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-analytics.js";
import {getDatabase,ref,get,set,update,push,remove,onValue,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getStorage,ref as sref,uploadBytes,getDownloadURL} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";
const firebaseConfig={apiKey:"AIzaSyB2Eh5G0cDPrNOyZKQR7M6IqL2Fp2mgNMY",authDomain:"kobotech-186af.firebaseapp.com",databaseURL:"https://kobotech-186af-default-rtdb.firebaseio.com",projectId:"kobotech-186af",storageBucket:"kobotech-186af.firebasestorage.app",messagingSenderId:"530705306325",appId:"1:530705306325:web:0a4092089cf6397941085c",measurementId:"G-EGJL6XM4DK"};
const app=initializeApp(firebaseConfig);
try{getAnalytics(app)}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const okUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const auth=getAuth(app),db=getDatabase(app),st=getStorage(app),$=id=>document.getElementById(id);
const F=['email','phone','location','name','tagline','about'];let unsubs=[],projects={},editId=null;
onAuthStateChanged(auth,u=>{
 $('login').classList.toggle('hidden',!!u);unsubs.forEach(f=>f());unsubs=[];if(!u)return;
 $('who').textContent=u.email;
 get(ref(db,'company')).then(x=>{const c=x.val()||{};F.forEach(k=>{if(c[k]!=null)$('f-'+k).value=c[k]})}).catch(console.error);
 unsubs.push(onValue(ref(db,'projects'),x=>{projects=x.val()||{};drawProjects()},console.error));
 unsubs.push(onValue(ref(db,'inquiries'),x=>drawInq(x.val()||{}),console.error));
});
$('lf').onsubmit=async e=>{e.preventDefault();$('l-err').textContent='';try{await signInWithEmailAndPassword(auth,$('l-email').value,$('l-pass').value)}catch(x){$('l-err').textContent='Login failed. Check your email and password.'}};
$('l-reset').onclick=async()=>{const m=$('l-email').value;if(!m){$('l-err').textContent='Enter your email first.';return}try{await sendPasswordResetEmail(auth,m);$('l-err').textContent='Reset email sent.'}catch(x){$('l-err').textContent='Could not send reset email.'}};
$('logout').onclick=e=>{e.preventDefault();signOut(auth)};
$('save-company').onclick=async function(){const d={updatedAt:Date.now()};F.forEach(k=>d[k]=$('f-'+k).value.trim());
 try{await update(ref(db,'company'),d);this.textContent='Saved ✓'}catch(x){console.error(x);this.textContent='Save failed'}
 setTimeout(()=>this.textContent='Save All Changes',2000)};
function drawProjects(){
 const l=Object.entries(projects).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));
 $('s-active').textContent=l.filter(x=>x[1].status==='Ongoing').length;$('s-done').textContent=l.filter(x=>x[1].status==='Completed').length;
 $('projects-grid').innerHTML=l.map(([id,x])=>'<div class="bg-white rounded-xl shadow-sm overflow-hidden border hover:border-kobotec-orange transition"><div class="h-48 bg-slate-200 relative">'+(okUrl(x.image)?'<img src="'+esc(x.image)+'" class="w-full h-full object-cover">':'')+'<button data-act="del" data-id="'+id+'" class="absolute top-2 right-2 bg-white/90 px-3 py-1 rounded-full text-red-600 text-sm shadow-sm">Delete</button></div><div class="p-4"><h4 class="font-bold text-kobotec-blue">'+esc(x.title)+'</h4><p class="text-sm text-slate-500 line-clamp-2">'+esc(x.description)+'</p><div class="mt-4 flex justify-between items-center"><span class="text-xs font-bold text-kobotec-orange uppercase">'+esc(x.status)+'</span><button data-act="edit" data-id="'+id+'" class="text-kobotec-blue text-sm font-semibold">Edit Details</button></div></div></div>').join('')||'<p class="text-slate-500">No projects yet. Click "Add New Project".</p>'}
$('projects-grid').onclick=async e=>{const b=e.target.closest('[data-act]');if(!b)return;
 if(b.dataset.act==='edit')openPM(b.dataset.id);
 else if(confirm('Delete this project?'))remove(ref(db,'projects/'+b.dataset.id)).catch(x=>alert('Delete failed'))};
function openPM(id){editId=id||null;const x=projects[id]||{};$('pm-title').textContent=id?'Edit Project':'New Project';
 $('p-title').value=x.title||'';$('p-desc').value=x.description||'';$('p-status').value=x.status||'Ongoing';$('p-url').value=x.image||'';$('p-file').value='';$('p-err').textContent='';$('pm').classList.remove('hidden')}
window.addProject=()=>openPM();
$('p-cancel').onclick=()=>$('pm').classList.add('hidden');
$('pf').onsubmit=async e=>{e.preventDefault();const b=$('p-save');b.disabled=true;b.textContent='Saving...';$('p-err').textContent='';
 try{let image=$('p-url').value.trim();const file=$('p-file').files[0];
  if(file){try{const r=sref(st,'projects/'+Date.now()+'_'+file.name.replace(/[^\w.-]/g,'_'));await uploadBytes(r,file);image=await getDownloadURL(r)}catch(x){$('p-err').textContent='Image upload failed (is Storage enabled?). Paste an image URL instead.';b.disabled=false;b.textContent='Save';return}}
  const d={title:$('p-title').value.trim(),description:$('p-desc').value.trim(),status:$('p-status').value,image};
  if(editId)await update(ref(db,'projects/'+editId),d);else await push(ref(db,'projects'),{...d,createdAt:Date.now()});
  $('pm').classList.add('hidden');
 }catch(x){console.error(x);$('p-err').textContent='Could not save project.'}
 b.disabled=false;b.textContent='Save'};
function drawInq(o){
 const l=Object.entries(o).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));
 $('s-inq').textContent=l.length;$('s-new').textContent=l.filter(x=>x[1].status==='new').length;
 $('inq-list').innerHTML=l.map(([id,x])=>'<div class="bg-white p-5 rounded-xl shadow-sm border-l-4 '+(x.status==='new'?'border-kobotec-orange':'border-slate-300')+'"><div class="flex justify-between flex-wrap gap-2"><div class="text-sm space-y-1"><p><b>'+esc(x.location)+'</b> <span class="text-xs text-slate-400">'+(x.createdAt?new Date(x.createdAt).toLocaleString():'')+'</span></p><p><a class="text-kobotec-blue underline" href="mailto:'+esc(x.email)+'">'+esc(x.email)+'</a> · <a class="text-kobotec-blue underline" href="tel:'+esc(x.phone)+'">'+esc(x.phone)+'</a></p>'+(x.details?'<p class="text-slate-600">'+esc(x.details)+'</p>':'')+'</div><div class="flex gap-3 items-start text-sm"><button data-act="toggle" data-id="'+id+'" data-s="'+esc(x.status)+'" class="font-semibold text-kobotec-blue">'+(x.status==='new'?'Mark handled':'Mark new')+'</button><button data-act="del" data-id="'+id+'" class="text-red-600">Delete</button></div></div></div>').join('')||'<p class="text-slate-500">No inquiries yet.</p>'}
$('inq-list').onclick=e=>{const b=e.target.closest('[data-act]');if(!b)return;const r=ref(db,'inquiries/'+b.dataset.id);
 if(b.dataset.act==='toggle')update(r,{status:b.dataset.s==='new'?'handled':'new'});else if(confirm('Delete this inquiry?'))remove(r)};
</script></body></html>
